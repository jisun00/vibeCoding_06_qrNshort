<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL2QR - 빠르고 세련된 QR코드 생성기</title>
  <meta name="description" content="URL을 입력하면 즉시 고해상도 QR코드를 생성하고 클릭 한 번으로 JPG 파일로 다운로드할 수 있는 웹 서비스">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/logo.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="state-initial">
  <!-- Interactive Aurora & Mesh Background Layers -->
  <div class="interactive-bg-wrapper">
    <div class="mesh-base-gradient"></div>
    <div class="mouse-interactive-glow" id="mouse-glow"></div>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="subtle-noise-overlay"></div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-group">
        <a href="../index.html" class="brand-link" id="logo-btn" title="메인 포털 / 홈으로">
          <img src="img/logo.png" alt="URL2QR Logo" class="brand-logo" id="header-logo">
          <span class="brand-title">LinkHub</span>
        </a>
      </div>

      <!-- Navigation Tabs: QR코드 & URL단축 -->
      <nav class="nav-switch-group" aria-label="서비스 전환">
        <a href="index.html" class="nav-tab-btn active" id="nav-btn-qr" title="현재 서비스: QR코드">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>QR코드</span>
        </a>
        <a href="../urlShort/index.html" class="nav-tab-btn" id="nav-btn-short" title="URL 단축기로 이동">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <span>URL단축</span>
        </a>
      </nav>

      <div class="header-badges">
        <span class="badge badge-pulse">
          <span class="badge-dot"></span>
          원클릭 JPG 다운로드 지원
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content Wrapper -->
  <main class="main-content">
    
    <!-- Hero Header (Shown initially in center) -->
    <div class="hero-container" id="hero-container">
      <div class="hero-text-block" id="hero-text">
        <span class="sub-pill">⚡ Instant QR Generator</span>
        <h1 class="hero-title">링크를 <span class="highlight">QR코드</span>로 순식간에</h1>
        <p class="hero-desc">URL을 입력하고 확인을 누르면 중앙에 QR코드가 완성됩니다.<br>생성된 QR코드를 클릭하면 JPG 파일로 바로 저장할 수 있어요.</p>
      </div>
    </div>

    <!-- QR Code Center Display Area (Reveals in center when generated) -->
    <section class="qr-display-section" id="qr-section" aria-live="polite">
      <div class="qr-card-wrapper">
        <!-- Interactive QR Box (Click to Download JPG) -->
        <div class="qr-card" id="qr-card" role="button" tabindex="0" title="클릭하여 JPG 파일로 다운로드">
          <div class="qr-corner-decor corner-tl"></div>
          <div class="qr-corner-decor corner-tr"></div>
          <div class="qr-corner-decor corner-bl"></div>
          <div class="qr-corner-decor corner-br"></div>
          
          <div class="qr-inner-frame">
            <!-- QR Canvas container rendered by qrcode.js -->
            <div id="qrcode" class="qrcode-canvas-wrap"></div>
          </div>

          <!-- Hover / Focus Overlay -->
          <div class="qr-overlay" id="qr-overlay">
            <div class="overlay-content">
              <div class="download-icon-circle">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
              </div>
              <span class="overlay-text">클릭하여 JPG 다운로드</span>
              <span class="overlay-subtext">고해상도 이미지로 즉시 저장</span>
            </div>
          </div>
        </div>

        <!-- QR Card Meta & Direct Actions -->
        <div class="qr-meta-panel" id="qr-meta-panel">
          <div class="target-url-info">
            <span class="url-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
            </span>
            <span class="target-url-text" id="target-url-display">https://...</span>
          </div>

          <div class="qr-action-buttons">
            <button type="button" class="btn btn-secondary" id="copy-url-btn" title="URL 주소 복사">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>링크 복사</span>
            </button>
            <button type="button" class="btn btn-primary" id="download-jpg-btn" title="JPG 파일 다운로드">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>JPG 다운로드</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Interactive URL Input Container (Transitions from Center to Bottom) -->
    <div class="input-stage" id="input-stage">
      <div class="input-card" id="input-card">
        <form id="qr-form" class="qr-form" autocomplete="off" onsubmit="return false;">
          <div class="input-icon-slot">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </div>
          
          <input 
            type="text" 
            id="url-input" 
            class="url-input" 
            placeholder="URL을 입력하세요 (예: https://naver.com)" 
            autocomplete="off"
            spellcheck="false"
            aria-label="변환할 URL 주소"
            required
          />

          <!-- Quick Clear Button -->
          <button type="button" class="clear-input-btn hidden" id="clear-input-btn" aria-label="입력 내용 지우기">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>

          <!-- Submit Button -->
          <button type="submit" id="submit-btn" class="submit-btn" aria-label="QR 코드 생성">
            <span class="btn-text">확인</span>
            <span class="btn-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </span>
          </button>
        </form>

        <!-- Quick Reset Link (Visible in Bottom Mode) -->
        <button type="button" class="reset-mode-btn" id="reset-mode-btn" title="새로운 URL로 처음부터 시작">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
            <path d="M8 16H3v5"></path>
          </svg>
          <span>처음으로</span>
        </button>
      </div>

      <!-- Quick sample suggestions -->
      <div class="sample-pills" id="sample-pills">
        <span class="sample-label">예시 링크:</span>
        <button type="button" class="sample-pill" data-url="https://google.com">google.com</button>
        <button type="button" class="sample-pill" data-url="https://naver.com">naver.com</button>
        <button type="button" class="sample-pill" data-url="https://youtube.com">youtube.com</button>
        <button type="button" class="sample-pill" data-url="https://instagram.com">instagram.com</button>
      </div>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container" aria-live="assertive"></div>

  <!-- Scripts -->
  <script src="js/qrcode.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
