<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkHub - URL 단축기</title>
  <meta name="description" content="긴 URL을 짧고 간결한 단축 링크로 즉시 변환하세요. 클릭 한 번으로 복사까지.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background -->
  <div class="bg-wrapper">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
    <div class="mouse-glow" id="mouse-glow"></div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-group">
        <a href="../index.html" class="brand-link" id="logo-btn" title="메인 포털로 이동">
          <div class="brand-dot"></div>
          <span class="brand-title">LinkHub</span>
        </a>
      </div>

      <!-- Navigation Tabs -->
      <nav class="nav-switch-group" aria-label="서비스 전환">
        <a href="../url2qr/index.html" class="nav-tab-btn" id="nav-btn-qr" title="QR코드 생성기로 이동">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>QR코드</span>
        </a>
        <a href="index.html" class="nav-tab-btn active" id="nav-btn-short" title="현재 서비스: URL단축">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <span>URL단축</span>
        </a>
      </nav>

      <div class="header-badges">
        <span class="badge badge-pulse">
          <span class="badge-dot"></span>
          TinyURL 미사용 · CORS 직접 연동
        </span>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="main-content">
    <!-- Hero -->
    <div class="hero-container">
      <div class="hero-text-block">
        <span class="sub-pill">🔗 Instant URL Shortener</span>
        <h1 class="hero-title">긴 링크를 <span class="highlight">짧게</span>, 순식간에</h1>
        <p class="hero-desc">URL을 입력하고 단축하기를 누르면 공유하기 쉬운 짧은 링크가 생성됩니다.<br>복사 버튼으로 즉시 클립보드에 저장하세요.</p>
      </div>
    </div>

    <!-- Input Card -->
    <div class="input-stage">
      <div class="input-card">

        <!-- URL Input Row -->
        <div class="form-row" id="url-form-row">
          <div class="input-wrapper">
            <span class="input-icon-slot" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </span>
            <input
              type="url"
              id="url-input"
              class="url-input"
              placeholder="단축할 URL을 입력하세요 (예: https://naver.com/...)"
              autocomplete="off"
              spellcheck="false"
              aria-label="단축할 URL 주소"
            />
            <button type="button" class="clear-btn hidden" id="clear-btn" aria-label="입력 내용 지우기">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <button type="button" class="shorten-btn" id="shorten-btn" disabled aria-label="URL 단축하기">
            <span class="btn-text">단축하기</span>
            <span class="btn-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
            </span>
          </button>
        </div>

        <!-- Loading Indicator -->
        <div class="loading-row hidden" id="loading-row" aria-live="polite">
          <div class="loading-spinner"></div>
          <span class="loading-text">단축 링크를 생성하는 중...</span>
        </div>

        <!-- Output Row -->
        <div class="output-row hidden" id="output-row" aria-live="polite">
          <div class="output-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            단축된 URL
          </div>
          <div class="output-wrapper">
            <input
              type="text"
              id="output-input"
              class="output-input"
              readonly
              aria-label="단축된 URL 결과"
              placeholder=""
            />
            <a href="#" id="open-link-btn" class="open-link-btn" target="_blank" rel="noopener" title="새 탭에서 열기">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
            </a>
            <button type="button" class="copy-btn" id="copy-btn" aria-label="단축 URL 복사">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="copy-icon">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>복사</span>
            </button>
          </div>
        </div>

        <!-- Error Row -->
        <div class="error-row hidden" id="error-row" role="alert">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="error-msg">URL 단축 중 오류가 발생했습니다. 다시 시도해 주세요.</span>
        </div>

      </div>

      <!-- Sample Pills -->
      <div class="sample-pills" id="sample-pills">
        <span class="sample-label">예시 링크:</span>
        <button type="button" class="sample-pill" data-url="https://www.google.com/search?q=qr+code+generator&oq=qr+code" id="sample-1">google.com/search</button>
        <button type="button" class="sample-pill" data-url="https://www.youtube.com/watch?v=dQw4w9WgXcQ" id="sample-2">youtube.com/watch</button>
        <button type="button" class="sample-pill" data-url="https://www.naver.com/news/main.nhn?mode=LSD&mid=sec" id="sample-3">naver.com/news</button>
      </div>
    </div>

    <!-- History Section -->
    <div class="history-section hidden" id="history-section">
      <div class="history-header">
        <h2 class="history-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          최근 단축 기록
        </h2>
        <button type="button" class="clear-history-btn" id="clear-history-btn">기록 지우기</button>
      </div>
      <ul class="history-list" id="history-list"></ul>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast-container" id="toast-container" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
