<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkHub - 리다이렉트 중...</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #F5F3FF;
      font-family: 'Outfit', -apple-system, sans-serif;
      color: #1E1B4B;
    }
    .card {
      background: #fff; border-radius: 24px; padding: 48px 40px;
      box-shadow: 0 12px 40px rgba(99,102,241,0.14);
      text-align: center; max-width: 380px; width: 90%;
    }
    .spinner {
      width: 48px; height: 48px; border-radius: 50%;
      border: 4px solid rgba(99,102,241,0.15);
      border-top-color: #6366F1;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 10px; }
    p  { font-size: 0.9rem; color: #6B7280; line-height: 1.6; }
    .url-display {
      margin-top: 16px; padding: 10px 14px;
      background: #EEF2FF; border-radius: 10px;
      font-size: 0.82rem; color: #4338CA;
      word-break: break-all;
    }
    .error { color: #EF4444; }
    .back-btn {
      display: inline-block; margin-top: 24px;
      padding: 10px 22px; border-radius: 999px;
      background: #6366F1; color: #fff;
      font-size: 0.88rem; font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">리다이렉트 중...</h1>
    <p id="desc">잠시만 기다려 주세요.</p>
    <div class="url-display hidden" id="url-display"></div>
  </div>

  <script>
    (function () {
      const LOCAL_MAP_KEY = 'linkhub_local_map';
      const params = new URLSearchParams(location.search);
      const code = params.get('c');

      if (!code) {
        showError('잘못된 링크입니다. 코드가 없습니다.');
        return;
      }

      const map = JSON.parse(localStorage.getItem(LOCAL_MAP_KEY) || '{}');
      const target = map[code];

      if (!target) {
        showError('링크를 찾을 수 없습니다.<br>다른 브라우저나 기기에서는 로컬 단축 링크가 작동하지 않습니다.');
        return;
      }

      // 목적지 URL 표시 후 리다이렉트
      document.getElementById('url-display').textContent = target;
      document.getElementById('url-display').classList.remove('hidden');
      document.getElementById('desc').textContent = '아래 주소로 이동합니다...';

      setTimeout(() => { location.replace(target); }, 800);

      function showError(msg) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = '링크 오류';
        document.getElementById('desc').innerHTML =
          `<span class="error">${msg}</span>`;
        document.getElementById('card').insertAdjacentHTML('beforeend',
          `<a class="back-btn" href="index.html">← URL 단축기로 돌아가기</a>`);
      }
    })();
  </script>
</body>
</html>
